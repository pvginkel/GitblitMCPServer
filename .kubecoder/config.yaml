# The environment for the Gitblit MCP server and its companion Gitblit plugin.
# Schema: https://kubecoder.home/help/reference/config-yaml/

repos:
  # The Java/Maven Gitblit plugin serving the /api/.mcp-internal REST API this
  # server adapts. Worked on and built from here; it carries its own
  # .kubecoder/project.yaml.
  - url: https://github.com/pvginkel/GitblitMCPSupportPlugin
  # git-sync's deploy repo, whose chart runs Gitblit (gitblit-app) with the
  # plugin installed. It carries its own .kubecoder/project.yaml, whose verbs
  # run in `iac` and `aac-tools`.
  - url: https://github.com/pvginkel/GitSyncDeploy

capabilities:
  github: rw

tools:
  - use: python # this repo: Poetry, pytest, Ruff, mypy
  - use: java # GitblitMCPSupportPlugin: OpenJDK and Maven
  - use: iac # GitSyncDeploy: Helm and Terraform
  - use: aac-tools # arch-validate in this repo's and the plugin's lint; GitSyncDeploy: gen-architecture

# This repo and the plugin ship a Dockerfile that Jenkins builds with kaniko; `kaniko` in the
# dev container is how they are built here.
imageBuilder: true

# The MCP server's HTTP/SSE endpoint when it is run from this environment.
ports:
  - name: mcp
    port: 8000
    type: http
    sslOffload: true
